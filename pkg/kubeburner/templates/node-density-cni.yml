---
global:
  gc: {{.GC}}
  gcMetrics: {{.GC_METRICS}}
  deletionStrategy: {{.DELETION_STRATEGY}}
  measurements:
    - name: podLatency
{{ if ne .POD_READY_THRESHOLD 0 }}
      thresholds:
        - conditionType: Ready
          metric: P99
          threshold: {{.POD_READY_THRESHOLD}}
{{ end }}
{{ if .SVC_LATENCY }}
    - name: serviceLatency
      svcTimeout: 10s
{{ end }}

jobs:
  - name: node-density-cni-dpusim
    namespace: node-density-cni
    jobIterations: {{.JOB_ITERATIONS}}
    qps: {{.QPS}}
    burst: {{.BURST}}
    namespacedIterations: {{.NAMESPACED_ITERATIONS}}
    iterationsPerNamespace: {{.ITERATIONS_PER_NAMESPACE}}
    churnConfig:
      cycles: {{.CHURN_CYCLES}}
      duration: {{.CHURN_DURATION}}
      percent: {{.CHURN_PERCENT}}
      delay: {{.CHURN_DELAY}}
      mode: {{.CHURN_MODE}}
    podWait: false
    waitWhenFinished: true
    # Disabled: kube-burner preload DS cannot request dpusim.io/vf. In Kind
    # mode, dpu-sim kind-loads sampleapp/curl before init instead.
    preLoadImages: false

    objects:
      - objectTemplate: webserver-deployment.yml
        replicas: 1
        inputVars:
          vfResource: {{.VF_RESOURCE}}

      - objectTemplate: webserver-service.yml
        replicas: 1

      - objectTemplate: curl-deployment.yml
        replicas: 1
        inputVars:
          vfResource: {{.VF_RESOURCE}}
