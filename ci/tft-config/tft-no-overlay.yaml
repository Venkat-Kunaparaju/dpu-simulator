tft:
  - name: "tft-no-overlay"
    namespace: "default"
    test_cases: "1-24,26,35-45,70-79"
    duration: 5
    pre_provision: true
    udn_primary_network:
      mode: cudn
      topology: layer3
      transport: no-overlay
      frr_configuration_selector:
        name: receive-all
    connections:
      - name: "iperf-tcp"
        type: "iperf-tcp"
        instances: 1
        reverse: false
        server:
          - name: "dpu-sim-host-worker"
            persistent: false
            sriov: true
            default_network: "default/ovn-primary"
        client:
          - name: "dpu-sim-host-worker2"
            sriov: true
            default_network: "default/ovn-primary"
        resource_name: "dpusim.io/vf"
      - name: "http-curl"
        type: "http"
        instances: 1
        reverse: false
        server:
          - name: "dpu-sim-host-worker"
            persistent: false
            sriov: true
            default_network: "default/ovn-primary"
        client:
          - name: "dpu-sim-host-worker2"
            sriov: true
            default_network: "default/ovn-primary"
        resource_name: "dpusim.io/vf"
